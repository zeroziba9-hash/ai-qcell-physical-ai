services:
  - type: web
    name: ai-qcell-physical-ai
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /_stcore/health
    autoDeployTrigger: checksPass
    envVars:
      - key: QCELL_AUTH_MODE
        value: strict
      - key: QCELL_USERS_JSON
        sync: false
      - key: STREAMLIT_SERVER_MAX_UPLOAD_SIZE
        value: "500"
      - key: STREAMLIT_BROWSER_GATHER_USAGE_STATS
        value: "false"
    disk:
      name: qcell-artifacts
      mountPath: /app/artifacts
      sizeGB: 1
