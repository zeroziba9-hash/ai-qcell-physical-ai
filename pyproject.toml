[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-qcell"
version = "0.1.0"
description = "Physical AI visual inspection and automatic sorting portfolio"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0,<3",
  "Pillow>=10,<12",
]

[tool.setuptools.packages.find]
include = ["qcell*"]
